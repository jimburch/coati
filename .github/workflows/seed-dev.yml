name: Seed Dev Database

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reset database first (drops everything, re-runs all migrations)'
        required: false
        type: boolean
        default: true

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: dev
    env:
      # Direct Neon URL: postgresql://neondb_owner:<password>@<host>/neondb?sslmode=require
      DATABASE_URL: ${{ secrets.NEON_DEV_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reset database
        if: inputs.reset
        run: pnpm exec tsx scripts/reset-db.ts

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed
        run: pnpm seed:dev
